<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'" />
  <title>Steam File Transfer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 통합 타이틀바: 창 테두리 대신 이 영역을 끌어 창을 옮긴다 -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 8h13m0 0l-3-3m3 3l-3 3M20 16H7m0 0l3-3m-3 3l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="title">Steam File Transfer</div>
    </div>
  </header>

  <main class="layout">
    <!-- 게임 목록: 이 기기의 게임. 항목의 보내기 아이콘으로 다른 기기에 통째로 동기화한다 -->
    <section class="panel" id="panelMine">
      <div class="panel-head">
        <h2>게임 목록</h2>
        <span class="hint" id="mineHint"></span>
        <button class="icon-btn" id="btnRefreshMine" title="새로고침" aria-label="새로고침">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12a8 8 0 0 1 13.6-5.7L20 8M20 3v5h-5M20 12a8 8 0 0 1-13.6 5.7L4 16M4 21v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="mineSearch"></div>
      <div class="gamelist" id="mineList">
        <div class="empty">Steam 라이브러리를 읽는 중…</div>
      </div>
    </section>

    <!-- 패널 사이 손잡이: 평소엔 보이지 않고, 잡고 끄는 동안만 색이 든다 -->
    <div class="splitter split-v" id="splitV" title="끌어서 너비 조절, 더블클릭하면 원래대로"></div>
    <div class="splitter split-h" id="splitH" title="끌어서 높이 조절, 더블클릭하면 원래대로"></div>

    <!-- 기기 목록: 이 기기가 맨 위. 기기를 누르면 그 기기의 게임 목록이 같은 모양으로 펼쳐진다 -->
    <section class="panel" id="panelDevices">
      <div class="panel-head">
        <h2>기기 목록</h2>
        <span class="hint" id="peerHint">다른 기기를 찾는 중…</span>
        <button class="icon-btn" id="btnRefreshPeers" title="새로고침" aria-label="새로고침">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 12a8 8 0 0 1 13.6-5.7L20 8M20 3v5h-5M20 12a8 8 0 0 1-13.6 5.7L4 16M4 21v-5h5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="devices" id="deviceList"></div>
    </section>

    <!-- 전송 상태: 큐에 쌓인 작업과 들어오는 수신 -->
    <section class="panel wide" id="panelStatus">
      <div class="panel-head">
        <h2>전송 상태</h2>
        <span class="hint" id="statusHint"></span>
        <span class="hint warn" id="statusWarn" hidden></span>
        <button class="icon-btn" id="btnClearJobs" title="완료된 항목 지우기" aria-label="완료된 항목 지우기">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="jobs" id="jobList">
        <div class="empty">기기 목록에서 받기나 덮어씌우기를 누르면 여기에 쌓여 차례로 진행됩니다.</div>
      </div>
      <div class="inbound" id="inboundWrap" hidden>
        <div class="inbound-head">들어오는 전송</div>
        <div id="inboundList"></div>
      </div>
    </section>
  </main>

  <!-- 자체 메시지 상자 (OS 대화상자 대신) -->
  <div class="modal" id="modalMsg" hidden>
    <div class="modal-box msgbox">
      <h3 id="msgTitle"></h3>
      <p class="msg-text" id="msgText"></p>
      <div class="row end gap" id="msgButtons"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
